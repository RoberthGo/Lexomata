[package]
name = "lexomata-desktop"
version = "0.1.0"
description = "Simulador offline de autómatas y máquinas de Turing"
authors = ["Roberth Gordillo Herrera"]
license = "MIT"
edition = "2021"

[lib]
name = "lexomata_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
incremental = true
